# Прогон всех тестов на каждый push, HTML-отчёт сохраняется как артефакт
name: tests

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # тесты запускаются в том же Docker-образе, что и локально
      - name: Build image
        run: docker build -t qa-piro .

      - name: Run tests
        run: docker run --rm -e CI=true -v "$PWD/playwright-report:/app/playwright-report" qa-piro

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
